name: test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Qt runtime libraries Linux needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libdbus-1-3 libfontconfig1
      - run: pip install -e ".[dev]"
      - name: Run the suite, including every shipped solution
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  package:
    name: package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Qt runtime libraries Linux needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1 fuse desktop-file-utils

      - run: pip install -e ".[dev,build]"

      - name: Freeze and package
        run: python packaging/build.py --installer

      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # The runner has no FUSE, so run the tool from its extracted contents.
          ( cd /tmp && ./appimagetool --appimage-extract >/dev/null )
          sudo ln -sf /tmp/squashfs-root/AppRun /usr/local/bin/appimagetool
          bash packaging/linux/build-appimage.sh

      - name: Name the macOS artefacts by architecture
        if: runner.os == 'macOS'
        run: |
          # Both macOS runners produce identically named files, so the
          # architecture has to go into the name or one overwrites the other
          # when the artefacts are merged. Keep the suffix that the upload
          # globs match on at the end of the name, or the file is silently
          # dropped from the release.
          set -eu
          arch="$(uname -m)"
          for file in dist/*.dmg; do
            [ -e "$file" ] || continue
            mv "$file" "${file%.dmg}-macos-${arch}.dmg"
          done
          for file in dist/*-macos-portable.zip; do
            [ -e "$file" ] || continue
            mv "$file" "${file%-macos-portable.zip}-macos-${arch}-portable.zip"
          done
          echo "artefacts to upload:"
          ls -1 dist

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -lh artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body_file: .github/RELEASE_NOTES.md
