name: test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Qt runtime libraries Linux needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libdbus-1-3 libfontconfig1
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run the suite, including every shipped solution
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  package:
    name: package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Qt runtime libraries Linux needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1 fuse desktop-file-utils

      - run: pip install -e ".[dev,build]"

      - name: Freeze and package
        run: python packaging/build.py --installer

      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # The runner has no FUSE, so run the tool from its extracted contents.
          ( cd /tmp && ./appimagetool --appimage-extract >/dev/null )
          sudo ln -sf /tmp/squashfs-root/AppRun /usr/local/bin/appimagetool
          bash packaging/linux/build-appimage.sh

      - name: Name the macOS artefacts by architecture
        if: runner.os == 'macOS'
        run: |
          # Both macOS runners produce identically named files, so the
          # architecture has to go into the name or one overwrites the other
          # when the artefacts are merged. Keep the suffix that the upload
          # globs match on at the end of the name, or the file is silently
          # dropped from the release.
          set -eu
          arch="$(uname -m)"
          for file in dist/*.dmg; do
            [ -e "$file" ] || continue
            mv "$file" "${file%.dmg}-macos-${arch}.dmg"
          done
          for file in dist/*-macos-portable.zip; do
            [ -e "$file" ] || continue
            mv "$file" "${file%-macos-portable.zip}-macos-${arch}-portable.zip"
          done
          echo "artefacts to upload:"
          ls -1 dist

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -lh artifacts

      - name: Refuse a release that is missing a file or disagrees with its tag
        run: |
          # Every build, old and new, finds its update by file name. A missing
          # windows-setup.exe strands every installed Windows copy, and a file
          # still called ...-windows-portable.zip would be picked up by 1.0.x
          # portable builds, whose updater damages the folder it runs from.
          # The tag must also match version.py, or every file is misnamed and
          # the installed build reports the wrong version.
          python packaging/build.py --check-release artifacts --tag "${GITHUB_REF_NAME}"

      - name: Publish a checksum for every artefact
        run: |
          # The installers and the in-app updater refuse to install anything
          # that is not listed here, so this file is what makes a swapped
          # download detectable. One "<sha256>  <filename>" line per artefact,
          # exactly the shape sha256sum writes and shasum -c reads.
          set -eu
          cd artifacts
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)
          lines=$(wc -l < SHA256SUMS)
          if [ "$files" -ne "$lines" ]; then
            echo "SHA256SUMS lists $lines files but there are $files" >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
          echo "published checksums:"
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: "true"
          # The body is the release notes file alone. The in-app update
          # dialog of every build shows the start of it, and CHANGELOG.md
          # holds the full record.
          generate_release_notes: false
          body_file: .github/RELEASE_NOTES.md
